[tool.poetry]
name = "everystreet"
version = "0.1.0"
description = "An algorithm finding #everystreet challenge route on Open Street Map"
authors = ["Matej Kerekrety <matej.kerekrety@gmail.com>"]
license = "MIT License"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mk-network = {git = "https://github.com/matejker/network", branch = "master"}
notebook = "^7.0"
# mk-network caps networkx <3 and numpy <2, so these floors are the highest patched
# versions still compatible with the whole dependency graph.
networkx = ">=2.8.8,<3.0"
osmnx = "^2.0"
matplotlib = "^3.9"
numpy = ">=1.26,<2.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
